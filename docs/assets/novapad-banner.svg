<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Left: Glowing Emblem (Book & IDE Fusion) -->
  <g transform="translate(100, 70)">
    <!-- Ambient Glow -->
    <circle cx="110" cy="110" r="90" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>
    
    <!-- Open Book Left Page (Learning) -->
    <path d="M 20 40 Q 65 30 105 45 L 105 185 Q 65 170 20 180 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Book lines / lesson paragraphs -->
    <line x1="35" y1="75" x2="90" y2="75" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="35" y1="100" x2="85" y2="100" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="35" y1="125" x2="75" y2="125" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="35" y1="150" x2="90" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Open Book Right Page (Interactive IDE) -->
    <path d="M 115 45 Q 155 30 200 40 L 200 180 Q 155 170 115 185 Z" fill="#0f172a" stroke="#818cf8" stroke-width="2.5" />
    <!-- Terminal Window Details -->
    <circle cx="132" cy="70" r="3.5" fill="#f43f5e" />
    <circle cx="144" cy="70" r="3.5" fill="#f59e0b" />
    <circle cx="156" cy="70" r="3.5" fill="#10b981" />
    
    <!-- Terminal Code / Prompt -->
    <path d="M 132 100 L 142 107 L 132 114" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="148" y1="114" x2="162" y2="114" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="132" y1="135" x2="182" y2="135" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="132" y1="155" x2="170" y2="155" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Central Spine Spark / Star (Nova) -->
    <g transform="translate(110, 45)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#accentGrad)" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(360, 95)">
    <!-- Brand Title -->
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="850" fill="#ffffff" letter-spacing="-1.5">
      Nova<tspan fill="url(#accentGrad)">Pad</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#cbd5e1" letter-spacing="-0.2">
      Interactive Dual-Pane Learning Platform &amp; Multi-Language Web IDE
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="2" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
      Realistic 3D Flipbook &bull; Synchronized Dual-Page Scrolling &bull; WebAssembly Python &amp; SQLite &bull; Sandboxed C/C++
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: Flipbook -->
      <rect x="0" y="0" width="138" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="15" cy="15" r="4" fill="#38bdf8"/>
      <text x="28" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">3D Flipbook</text>

      <!-- Pill 2: Pyodide -->
      <rect x="148" y="0" width="144" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="163" cy="15" r="4" fill="#6366f1"/>
      <text x="176" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Pyodide Wasm</text>

      <!-- Pill 3: SQLite -->
      <rect x="302" y="0" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="317" cy="15" r="4" fill="#a855f7"/>
      <text x="330" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">sql.js SQLite</text>

      <!-- Pill 4: C/C++ Sandbox -->
      <rect x="452" y="0" width="168" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="467" cy="15" r="4" fill="#10b981"/>
      <text x="480" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">FastAPI C/C++ Runner</text>
    </g>
  </g>
</svg>
