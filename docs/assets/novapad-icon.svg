<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="iconAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="240" height="240" rx="48" fill="url(#iconBg)" stroke="#1e293b" stroke-width="3"/>
  <circle cx="120" cy="120" r="70" fill="#6366f1" opacity="0.15" filter="url(#iconGlow)"/>

  <!-- Open Book Left Page -->
  <path d="M 40 60 Q 80 50 115 65 L 115 175 Q 80 160 40 170 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <line x1="55" y1="90" x2="100" y2="90" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="55" y1="110" x2="95" y2="110" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="55" y1="130" x2="85" y2="130" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="55" y1="150" x2="100" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Open Book Right Page -->
  <path d="M 125 65 Q 160 50 200 60 L 200 170 Q 160 160 125 175 Z" fill="#0f172a" stroke="#818cf8" stroke-width="3" />
  <circle cx="140" cy="85" r="3" fill="#f43f5e" />
  <circle cx="150" cy="85" r="3" fill="#f59e0b" />
  <circle cx="160" cy="85" r="3" fill="#10b981" />
  <path d="M 140 110 L 148 116 L 140 122" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="154" y1="122" x2="168" y2="122" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="140" y1="142" x2="185" y2="142" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Nova Star Spine -->
  <g transform="translate(120, 65)">
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#iconAccent)" filter="url(#iconGlow)"/>
  </g>
</svg>
