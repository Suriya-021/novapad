name: 🐛 Bug Report
description: Report an issue or unexpected behavior in NovaPad
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible.
  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A concise description of what went wrong.
      placeholder: "e.g., Pyodide worker times out during multi-file import"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "Flipbook Reader (3D Book / Scroll Sync / Typography)"
        - "Monaco Editor & Tabs"
        - "Python Runtime (Pyodide Web Worker)"
        - "SQL Runtime (sql.js SQLite)"
        - "Web Playground (Sandboxed Iframe)"
        - "Backend Execution Service (FastAPI / C++)"
        - "Project Management / Storage (IndexedDB / ZIP)"
        - "Documentation / Other"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we trigger this bug?
      placeholder: |
        1. Open Chapter 1 in Flipbook view
        2. Click 'Click for Coding' on Lesson 3
        3. Run the Python code
        4. See error message in console
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually occurred?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Browser
      description: Browser version, operating system, and Node/Python versions.
      placeholder: "e.g., Chrome 129, Windows 11, Node v20.12.0"
    validations:
      required: false
